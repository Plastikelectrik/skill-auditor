<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-label="Correlación de señales: credenciales más red saliente equivale a exfiltración"><title>Correlación de señales: credenciales más red saliente equivale a exfiltración</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#101C36"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".22"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient><radialGradient id="redglow"><stop offset="0" stop-color="#F87171" stop-opacity=".25"/><stop offset="1" stop-color="#F87171" stop-opacity="0"/></radialGradient><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".05"/></pattern></defs><rect width="1280" height="620" fill="url(#bg)"/><rect width="1280" height="620" fill="url(#dots)"/><text x="64" y="86" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#E8EEF8" text-anchor="start" letter-spacing="-1">Las señales sueltas engañan; las combinadas delatan</text><text x="64" y="122" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#93A4C3" text-anchor="start" >El escáner cruza hallazgos del mismo archivo y sube la severidad cuando se encadenan.</text><rect x="64" y="160" width="300" height="210" rx="20" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><g transform="translate(90,188)" fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="20" r="8"/><path d="M19 20h19M31 20v8M37 20v6"/></g><rect x="285" y="192" width="55" height="26" rx="13.0" fill="#FBBF2426" stroke="#FBBF2499" stroke-width="1.2" /><text x="312.5" y="209.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="1">ALTO</text><text x="90" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#E8EEF8" text-anchor="start" >Lee credenciales</text><text x="90" y="316" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="500" fill="#FBBF24" text-anchor="start" >~/.ssh/id_rsa</text><text x="90" y="342" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" >o vuelca todo el entorno</text><rect x="476" y="160" width="300" height="210" rx="20" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><g transform="translate(502,188)" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="16"/><ellipse cx="20" cy="20" rx="7" ry="16"/><path d="M4 20h32"/></g><rect x="689" y="192" width="63" height="26" rx="13.0" fill="#60A5FA26" stroke="#60A5FA99" stroke-width="1.2" /><text x="720.5" y="209.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle" letter-spacing="1">MEDIO</text><text x="502" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#E8EEF8" text-anchor="start" >Red saliente</text><text x="502" y="316" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="500" fill="#60A5FA" text-anchor="start" >requests.post(…)</text><text x="502" y="342" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" >o curl a un dominio ajeno</text><text x="400" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="300" fill="#93A4C3" text-anchor="middle" >+</text><text x="812" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="300" fill="#93A4C3" text-anchor="middle" >=</text><circle cx="1046" cy="265.0" r="230" fill="url(#redglow)"/><rect x="876" y="160" width="340" height="210" rx="20" fill="#2A1418" stroke="#F87171" stroke-width="2.4" /><g transform="translate(902,188)" fill="none" stroke="#F87171" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4l17 30H3z"/><path d="M20 15v9M20 29v1"/></g><rect x="1113" y="192" width="79" height="26" rx="13.0" fill="#F8717126" stroke="#F8717199" stroke-width="1.2" /><text x="1152.5" y="209.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle" letter-spacing="1">CRÍTICO</text><text x="902" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#E8EEF8" text-anchor="start" >Exfiltración</text><text x="902" y="314" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#93A4C3" text-anchor="start" >Mismo archivo, misma ruta:</text><text x="902" y="340" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F87171" text-anchor="start" >veredicto NO INSTALAR.</text><rect x="64" y="402" width="368" height="112" rx="16" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><rect x="64" y="418" width="5" height="80" rx="2.5" fill="#F87171"/><rect x="88" y="416" width="74" height="24" rx="12.0" fill="#F8717126" stroke="#F8717199" stroke-width="1.2" /><text x="125.0" y="431.96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#F87171" text-anchor="middle" letter-spacing="1">CRÍTICO</text><text x="88" y="468" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E8EEF8" text-anchor="start" >base64 + exec</text><text x="88" y="494" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" >Decodifica un blob y lo ejecuta</text><rect x="456" y="402" width="368" height="112" rx="16" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><rect x="456" y="418" width="5" height="80" rx="2.5" fill="#FBBF24"/><rect x="480" y="416" width="53" height="24" rx="12.0" fill="#FBBF2426" stroke="#FBBF2499" stroke-width="1.2" /><text x="506.5" y="431.96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="1">ALTO</text><text x="480" y="468" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E8EEF8" text-anchor="start" >Claves en un archivo, red en otro</text><text x="480" y="494" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" >Hay que comprobar si se encadenan</text><rect x="848" y="402" width="368" height="112" rx="16" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><rect x="848" y="418" width="5" height="80" rx="2.5" fill="#60A5FA"/><rect x="872" y="416" width="60" height="24" rx="12.0" fill="#60A5FA26" stroke="#60A5FA99" stroke-width="1.2" /><text x="902.0" y="431.96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="middle" letter-spacing="1">MEDIO</text><text x="872" y="468" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E8EEF8" text-anchor="start" >Pre-autoriza Bash + acceso web</text><text x="872" y="494" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" >Combinación sensible de permisos</text><text x="64" y="556" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#93A4C3" text-anchor="start" >Un cliente de API que usa la red es normal. Un formateador de commits que lee ~/.ssh no lo es:</text><text x="64" y="584" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#93A4C3" text-anchor="start" >la pregunta es siempre si cada capacidad encaja con el propósito declarado.</text></svg>