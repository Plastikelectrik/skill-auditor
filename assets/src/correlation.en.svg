<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-label="Signal correlation: credentials plus outbound network equals exfiltration"><title>Signal correlation: credentials plus outbound network equals exfiltration</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#101C36"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".22"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient><radialGradient id="redglow"><stop offset="0" stop-color="#F87171" stop-opacity=".25"/><stop offset="1" stop-color="#F87171" stop-opacity="0"/></radialGradient><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".05"/></pattern></defs><rect width="1280" height="620" fill="url(#bg)"/><rect width="1280" height="620" fill="url(#dots)"/><text x="64" y="86" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#E8EEF8" text-anchor="start" letter-spacing="-1">Isolated signals mislead; combined ones give it away</text><text x="64" y="122" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#93A4C3" text-anchor="start" >The scanner cross-checks findings in the same file and raises severity when they chain.</text><rect x="64" y="160" width="300" height="210" rx="20" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><g transform="translate(90,188)" fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="20" r="8"/><path d="M19 20h19M31 20v8M37 20v6"/></g><rect x="285" y="192" width="55" height="26" rx="13.0" fill="#FBBF2426" stroke="#FBBF2499" stroke-width="1.2" /><text x="312.5" y="209.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="1">HIGH</text><text x="90" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#E8EEF8" text-anchor="start" >Reads credentials</text><text x="90" y="316" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="500" fill="#FBBF24" text-anchor="start" >~/.ssh/id_rsa</text><text x="90" y="342" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" >or dumps the whole environment</text><rect x="476" y="160" width="300" height="210" rx="20" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><g transform="translate(502,188)" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="16"/><ellipse cx="20" cy="20" rx="7" ry="16"/><path d="M4 20h32"/></g><rect x="681" y="192" width="71" height="26" rx="13.0" fill="#60A5FA26" stroke="#60A5FA99" stroke-width="1.2" /><text x="716.5" y="209.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle" letter-spacing="1">MEDIUM</text><text x="502" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#E8EEF8" text-anchor="start" >Outbound network</text><text x="502" y="316" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="500" fill="#60A5FA" text-anchor="start" >requests.post(…)</text><text x="502" y="342" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" >or curl to a foreign domain</text><text x="400" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="300" fill="#93A4C3" text-anchor="middle" >+</text><text x="812" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="300" fill="#93A4C3" text-anchor="middle" >=</text><circle cx="1046" cy="265.0" r="230" fill="url(#redglow)"/><rect x="876" y="160" width="340" height="210" rx="20" fill="#2A1418" stroke="#F87171" stroke-width="2.4" /><g transform="translate(902,188)" fill="none" stroke="#F87171" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4l17 30H3z"/><path d="M20 15v9M20 29v1"/></g><rect x="1105" y="192" width="87" height="26" rx="13.0" fill="#F8717126" stroke="#F8717199" stroke-width="1.2" /><text x="1148.5" y="209.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle" letter-spacing="1">CRITICAL</text><text x="902" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#E8EEF8" text-anchor="start" >Exfiltration</text><text x="902" y="314" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#93A4C3" text-anchor="start" >Same file, same path:</text><text x="902" y="340" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F87171" text-anchor="start" >verdict: DO NOT INSTALL.</text><rect x="64" y="402" width="368" height="112" rx="16" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><rect x="64" y="418" width="5" height="80" rx="2.5" fill="#F87171"/><rect x="88" y="416" width="82" height="24" rx="12.0" fill="#F8717126" stroke="#F8717199" stroke-width="1.2" /><text x="129.0" y="431.96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#F87171" text-anchor="middle" letter-spacing="1">CRITICAL</text><text x="88" y="468" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E8EEF8" text-anchor="start" >base64 + exec</text><text x="88" y="494" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" >Decodes a blob and runs it</text><rect x="456" y="402" width="368" height="112" rx="16" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><rect x="456" y="418" width="5" height="80" rx="2.5" fill="#FBBF24"/><rect x="480" y="416" width="53" height="24" rx="12.0" fill="#FBBF2426" stroke="#FBBF2499" stroke-width="1.2" /><text x="506.5" y="431.96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="1">HIGH</text><text x="480" y="468" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E8EEF8" text-anchor="start" >Keys here, network there</text><text x="480" y="494" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" >Check whether they chain up</text><rect x="848" y="402" width="368" height="112" rx="16" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><rect x="848" y="418" width="5" height="80" rx="2.5" fill="#60A5FA"/><rect x="872" y="416" width="67" height="24" rx="12.0" fill="#60A5FA26" stroke="#60A5FA99" stroke-width="1.2" /><text x="905.5" y="431.96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="middle" letter-spacing="1">MEDIUM</text><text x="872" y="468" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E8EEF8" text-anchor="start" >Pre-approved Bash + web</text><text x="872" y="494" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#93A4C3" text-anchor="start" >Sensitive permission combo</text><text x="64" y="556" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#93A4C3" text-anchor="start" >An API client using the network is normal. A commit formatter that reads ~/.ssh is not:</text><text x="64" y="584" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#93A4C3" text-anchor="start" >the question is always whether each capability fits the declared purpose.</text></svg>