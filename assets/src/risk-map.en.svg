<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="Risk families that Skill Auditor detects"><title>Risk families that Skill Auditor detects</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#101C36"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".22"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient><radialGradient id="redglow"><stop offset="0" stop-color="#F87171" stop-opacity=".25"/><stop offset="1" stop-color="#F87171" stop-opacity="0"/></radialGradient><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".05"/></pattern></defs><rect width="1280" height="760" fill="url(#bg)"/><rect width="1280" height="760" fill="url(#dots)"/><text x="64" y="86" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#E8EEF8" text-anchor="start" letter-spacing="-1">What it looks for</text><text x="64" y="122" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#93A4C3" text-anchor="start" >Eight risk families, with the severity the scanner assigns by default.</text><rect x="64" y="160" width="276" height="262" rx="18" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><path d="M82 160H322" stroke="#F87171" stroke-width="4" stroke-linecap="round"/><g transform="translate(88,190)" fill="none" stroke="#F87171" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="36" height="30" rx="5"/><path d="M10 15l8 6-8 6M22 28h9"/></g><rect x="229" y="194" width="87" height="26" rx="13.0" fill="#F8717126" stroke="#F8717199" stroke-width="1.2" /><text x="272.5" y="211.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle" letter-spacing="1">CRITICAL</text><text x="88" y="268" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E8EEF8" text-anchor="start" >Remote execution</text><text x="88" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >Downloads code and runs it</text><text x="88" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >before you can review it.</text><rect x="84" y="360" width="236" height="38" rx="10" fill="#0B1424" stroke="#2A3A5C" stroke-width="1" /><text x="98" y="385" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#F87171" text-anchor="start" >curl … | sh</text><rect x="356" y="160" width="276" height="262" rx="18" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><path d="M374 160H614" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/><g transform="translate(380,190)" fill="none" stroke="#FBBF24" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="34" height="34" rx="6"/><text x="20" y="26" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#FBBF24" stroke="none" text-anchor="middle">01</text></g><rect x="553" y="194" width="55" height="26" rx="13.0" fill="#FBBF2426" stroke="#FBBF2499" stroke-width="1.2" /><text x="580.5" y="211.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="1">HIGH</text><text x="380" y="268" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E8EEF8" text-anchor="start" >Obfuscation</text><text x="380" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >Encoded content that gets</text><text x="380" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >decoded and executed.</text><rect x="376" y="360" width="236" height="38" rx="10" fill="#0B1424" stroke="#2A3A5C" stroke-width="1" /><text x="390" y="385" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#FBBF24" text-anchor="start" >exec(b64decode(…))</text><rect x="648" y="160" width="276" height="262" rx="18" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><path d="M666 160H906" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/><g transform="translate(672,190)" fill="none" stroke="#FBBF24" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="20" r="8"/><path d="M19 20h19M31 20v8M37 20v6"/></g><rect x="845" y="194" width="55" height="26" rx="13.0" fill="#FBBF2426" stroke="#FBBF2499" stroke-width="1.2" /><text x="872.5" y="211.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="1">HIGH</text><text x="672" y="268" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E8EEF8" text-anchor="start" >Credentials</text><text x="672" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >Reads keys, tokens or the</text><text x="672" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >entire environment.</text><rect x="668" y="360" width="236" height="38" rx="10" fill="#0B1424" stroke="#2A3A5C" stroke-width="1" /><text x="682" y="385" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#FBBF24" text-anchor="start" >~/.ssh/id_rsa</text><rect x="940" y="160" width="276" height="262" rx="18" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><path d="M958 160H1198" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/><g transform="translate(964,190)" fill="none" stroke="#FBBF24" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="16"/><ellipse cx="20" cy="20" rx="7" ry="16"/><path d="M4 20h32"/></g><rect x="1137" y="194" width="55" height="26" rx="13.0" fill="#FBBF2426" stroke="#FBBF2499" stroke-width="1.2" /><text x="1164.5" y="211.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="1">HIGH</text><text x="964" y="268" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E8EEF8" text-anchor="start" >Exfiltration</text><text x="964" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >Sends data to destinations</text><text x="964" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >unrelated to the service.</text><rect x="960" y="360" width="236" height="38" rx="10" fill="#0B1424" stroke="#2A3A5C" stroke-width="1" /><text x="974" y="385" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#FBBF24" text-anchor="start" >webhook.site</text><rect x="64" y="442" width="276" height="262" rx="18" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><path d="M82 442H322" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/><g transform="translate(88,472)" fill="none" stroke="#FBBF24" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M33 20a13 13 0 1 1-4-9.5"/><path d="M31 3v9h-9"/></g><rect x="261" y="476" width="55" height="26" rx="13.0" fill="#FBBF2426" stroke="#FBBF2499" stroke-width="1.2" /><text x="288.5" y="493.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="1">HIGH</text><text x="88" y="550" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E8EEF8" text-anchor="start" >Persistence</text><text x="88" y="582" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >Outlives uninstallation or</text><text x="88" y="606" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >alters the agent itself.</text><rect x="84" y="642" width="236" height="38" rx="10" fill="#0B1424" stroke="#2A3A5C" stroke-width="1" /><text x="98" y="667" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#FBBF24" text-anchor="start" >~/.bashrc · .claude/</text><rect x="356" y="442" width="276" height="262" rx="18" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><path d="M374 442H614" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/><g transform="translate(380,472)" fill="none" stroke="#FBBF24" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="18" width="26" height="19" rx="4"/><path d="M13 18v-6a7 7 0 0 1 13-3"/></g><rect x="553" y="476" width="55" height="26" rx="13.0" fill="#FBBF2426" stroke="#FBBF2499" stroke-width="1.2" /><text x="580.5" y="493.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="1">HIGH</text><text x="380" y="550" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E8EEF8" text-anchor="start" >Excess permissions</text><text x="380" y="582" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >Asks for more access than</text><text x="380" y="606" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >its task needs.</text><rect x="376" y="642" width="236" height="38" rx="10" fill="#0B1424" stroke="#2A3A5C" stroke-width="1" /><text x="390" y="667" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#FBBF24" text-anchor="start" >allowed-tools: Bash(*)</text><rect x="648" y="442" width="276" height="262" rx="18" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><path d="M666 442H906" stroke="#F87171" stroke-width="4" stroke-linecap="round"/><g transform="translate(672,472)" fill="none" stroke="#F87171" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h30a3 3 0 0 1 3 3v17a3 3 0 0 1-3 3H18l-9 8v-8H5a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z"/></g><rect x="813" y="476" width="87" height="26" rx="13.0" fill="#F8717126" stroke="#F8717199" stroke-width="1.2" /><text x="856.5" y="493.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle" letter-spacing="1">CRITICAL</text><text x="672" y="550" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E8EEF8" text-anchor="start" >Prompt injection</text><text x="672" y="582" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >Text that gives the agent</text><text x="672" y="606" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >orders behind your back.</text><rect x="668" y="642" width="236" height="38" rx="10" fill="#0B1424" stroke="#2A3A5C" stroke-width="1" /><text x="682" y="667" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#F87171" text-anchor="start" >“don't tell the user”</text><rect x="940" y="442" width="276" height="262" rx="18" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><path d="M958 442H1198" stroke="#F87171" stroke-width="4" stroke-linecap="round"/><g transform="translate(964,472)" fill="none" stroke="#F87171" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20C10 6 30 6 38 20 30 34 10 34 2 20z"/><circle cx="20" cy="20" r="6"/><path d="M6 36L34 4"/></g><rect x="1105" y="476" width="87" height="26" rx="13.0" fill="#F8717126" stroke="#F8717199" stroke-width="1.2" /><text x="1148.5" y="493.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle" letter-spacing="1">CRITICAL</text><text x="964" y="550" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E8EEF8" text-anchor="start" >Concealment</text><text x="964" y="582" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >Invisible Unicode and</text><text x="964" y="606" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >hidden HTML comments.</text><rect x="960" y="642" width="236" height="38" rx="10" fill="#0B1424" stroke="#2A3A5C" stroke-width="1" /><text x="974" y="667" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#F87171" text-anchor="start" >U+202E · &lt;!-- … --&gt;</text></svg>