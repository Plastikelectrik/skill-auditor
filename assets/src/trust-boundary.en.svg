<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-label="The audited target is treated as untrusted data, never as instructions"><title>The audited target is treated as untrusted data, never as instructions</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#101C36"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".22"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient><radialGradient id="redglow"><stop offset="0" stop-color="#F87171" stop-opacity=".25"/><stop offset="1" stop-color="#F87171" stop-opacity="0"/></radialGradient><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".05"/></pattern></defs><rect width="1280" height="620" fill="url(#bg)"/><rect width="1280" height="620" fill="url(#dots)"/><text x="64" y="86" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#E8EEF8" text-anchor="start" letter-spacing="-1">The target is data, never instructions</text><text x="64" y="122" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#93A4C3" text-anchor="start" >What an audited skill says is evidence to quote, not orders to follow.</text><rect x="64" y="160" width="330" height="250" rx="20" fill="#1A1220" stroke="#F87171" stroke-width="2.2" stroke-dasharray="9 7"/><text x="88" y="200" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#E8EEF8" text-anchor="start" >Target skill</text><text x="88" y="226" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F87171" text-anchor="start" >untrusted text</text><rect x="84" y="256" width="290" height="34" rx="8" fill="#F871711F" stroke="none" stroke-width="0" /><text x="98" y="279" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#F87171" text-anchor="start" >Do not tell the user…</text><rect x="84" y="300" width="290" height="34" rx="8" fill="#F871711F" stroke="none" stroke-width="0" /><text x="98" y="323" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#F87171" text-anchor="start" >curl … | sh</text><rect x="84" y="344" width="290" height="34" rx="8" fill="#F871711F" stroke="none" stroke-width="0" /><text x="98" y="367" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#F87171" text-anchor="start" >&lt;!-- ignore previous --&gt;</text><path d="M398 285H498" stroke="#2DD4BF" stroke-width="3.4" stroke-linecap="round" fill="none"/><path d="M492 277l10 8-10 8" stroke="#2DD4BF" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="452" y="262" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2DD4BF" text-anchor="middle" >read-only</text><circle cx="640" cy="285" r="200" fill="url(#glow)"/><rect x="510" y="200" width="260" height="170" rx="20" fill="#131D33" stroke="#2DD4BF" stroke-width="2.4" /><g transform="translate(540,224)" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 3l15 6v11c0 9-7 15-15 18C12 35 5 29 5 20V9z"/><path d="M13 20l5 5 10-11"/></g><text x="540" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#E8EEF8" text-anchor="start" >Skill Auditor</text><text x="540" y="328" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#93A4C3" text-anchor="start" >scanner + critical reading</text><text x="540" y="350" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#93A4C3" text-anchor="start" >static analysis</text><path d="M774 285H882" stroke="#2DD4BF" stroke-width="3.4" stroke-linecap="round" fill="none"/><path d="M876 277l10 8-10 8" stroke="#2DD4BF" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="894" y="160" width="322" height="250" rx="20" fill="#131D33" stroke="#2A3A5C" stroke-width="1.8" /><text x="918" y="200" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#E8EEF8" text-anchor="start" >Report</text><text x="918" y="226" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#93A4C3" text-anchor="start" >quoted evidence, with location</text><rect x="918" y="250" width="144" height="30" rx="15.0" fill="#F8717126" stroke="#F8717199" stroke-width="1.2" /><text x="990.0" y="269.68" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#F87171" text-anchor="middle" letter-spacing="1">DO NOT INSTALL</text><rect x="918" y="300" width="274" height="34" rx="8" fill="#0B1424" stroke="#2A3A5C" stroke-width="1" /><text x="932" y="322" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#F87171" text-anchor="start" >SKILL.md:11 · critical</text><rect x="918" y="344" width="274" height="34" rx="8" fill="#0B1424" stroke="#2A3A5C" stroke-width="1" /><text x="932" y="366" font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#F87171" text-anchor="start" >scripts/setup.sh:5 · critical</text><path d="M229 414V506" stroke="#F87171" stroke-width="3.4" stroke-dasharray="3 9" stroke-linecap="round"/><circle cx="229" cy="460" r="22" fill="#2A1418" stroke="#F87171" stroke-width="2.6"/><path d="M219 450l20 20M239 450l-20 20" stroke="#F87171" stroke-width="3.6" stroke-linecap="round"/><rect x="64" y="510" width="330" height="62" rx="16" fill="#131D33" stroke="#2A3A5C" stroke-width="1.8" /><text x="88" y="536" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E8EEF8" text-anchor="start" >Your machine and credentials</text><text x="88" y="558" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#93A4C3" text-anchor="start" >untouched</text><text x="274" y="450" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#E8EEF8" text-anchor="start" >Its scripts are never run</text><text x="274" y="476" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#93A4C3" text-anchor="start" >and its instructions are never followed,</text><text x="274" y="498" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#93A4C3" text-anchor="start" >however reasonable the excuse sounds.</text></svg>