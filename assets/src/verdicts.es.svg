<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-label="Los cuatro veredictos de Skill Auditor"><title>Los cuatro veredictos de Skill Auditor</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#101C36"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".22"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient><radialGradient id="redglow"><stop offset="0" stop-color="#F87171" stop-opacity=".25"/><stop offset="1" stop-color="#F87171" stop-opacity="0"/></radialGradient><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".05"/></pattern></defs><rect width="1280" height="470" fill="url(#bg)"/><rect width="1280" height="470" fill="url(#dots)"/><text x="64" y="86" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#E8EEF8" text-anchor="start" letter-spacing="-1">Cuatro veredictos</text><text x="64" y="122" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#93A4C3" text-anchor="start" >El escáner propone uno; la lectura manual lo confirma o lo corrige con motivo escrito.</text><rect x="64" y="160" width="276" height="230" rx="18" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><path d="M82 160H322" stroke="#F87171" stroke-width="5" stroke-linecap="round"/><circle cx="104" cy="212" r="14" fill="#F87171" fill-opacity=".2" stroke="#F87171" stroke-width="2.4"/><text x="130" y="219" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#F87171" text-anchor="start" >NO INSTALAR</text><text x="88" y="272" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >Hay algún hallazgo crítico:</text><text x="88" y="298" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >ejecución remota, exfiltración</text><text x="88" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >u ocultar acciones al usuario.</text><rect x="88" y="344" width="71" height="26" rx="13.0" fill="#F8717126" stroke="#F8717199" stroke-width="1.2" /><text x="123.5" y="361.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle" letter-spacing="1">exit 2</text><rect x="356" y="160" width="276" height="230" rx="18" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><path d="M374 160H614" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/><circle cx="396" cy="212" r="14" fill="#FBBF24" fill-opacity=".2" stroke="#FBBF24" stroke-width="2.4"/><text x="422" y="219" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FBBF24" text-anchor="start" >REVISAR A FONDO</text><text x="380" y="272" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >Altos sin justificar, o cinco</text><text x="380" y="298" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >o más medios. Pide al autor</text><text x="380" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >que aclare antes de decidir.</text><rect x="380" y="344" width="71" height="26" rx="13.0" fill="#FBBF2426" stroke="#FBBF2499" stroke-width="1.2" /><text x="415.5" y="361.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="1">exit 1</text><rect x="648" y="160" width="276" height="230" rx="18" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><path d="M666 160H906" stroke="#60A5FA" stroke-width="5" stroke-linecap="round"/><circle cx="688" cy="212" r="14" fill="#60A5FA" fill-opacity=".2" stroke="#60A5FA" stroke-width="2.4"/><text x="714" y="219" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#60A5FA" text-anchor="start" >RIESGO BAJO</text><text x="672" y="272" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >Solo avisos menores. Instala</text><text x="672" y="298" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >con precauciones: versiones</text><text x="672" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >fijadas y permisos mínimos.</text><rect x="672" y="344" width="71" height="26" rx="13.0" fill="#60A5FA26" stroke="#60A5FA99" stroke-width="1.2" /><text x="707.5" y="361.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle" letter-spacing="1">exit 0</text><rect x="940" y="160" width="276" height="230" rx="18" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><path d="M958 160H1198" stroke="#4ADE80" stroke-width="5" stroke-linecap="round"/><circle cx="980" cy="212" r="14" fill="#4ADE80" fill-opacity=".2" stroke="#4ADE80" stroke-width="2.4"/><text x="1006" y="219" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#4ADE80" text-anchor="start" >SIN HALLAZGOS</text><text x="964" y="272" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >No se encontró nada y todo</text><text x="964" y="298" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >encaja con su propósito.</text><text x="964" y="324" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#93A4C3" text-anchor="start" >No es una garantía.</text><rect x="964" y="344" width="71" height="26" rx="13.0" fill="#4ADE8026" stroke="#4ADE8099" stroke-width="1.2" /><text x="999.5" y="361.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#4ADE80" text-anchor="middle" letter-spacing="1">exit 0</text><text x="64" y="430" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#93A4C3" text-anchor="start" >El código de salida del escáner (0, 1 o 2) permite usarlo también en scripts o en CI.</text></svg>