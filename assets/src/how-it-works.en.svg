<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" role="img" aria-label="How Skill Auditor works: isolate, scan, read and decide"><title>How Skill Auditor works: isolate, scan, read and decide</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#101C36"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".22"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient><radialGradient id="redglow"><stop offset="0" stop-color="#F87171" stop-opacity=".25"/><stop offset="1" stop-color="#F87171" stop-opacity="0"/></radialGradient><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".05"/></pattern></defs><rect width="1280" height="580" fill="url(#bg)"/><rect width="1280" height="580" fill="url(#dots)"/><text x="64" y="86" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#E8EEF8" text-anchor="start" letter-spacing="-1">How it works</text><text x="64" y="122" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#93A4C3" text-anchor="start" >Four steps, from the suspicious folder to a verdict you can defend.</text><rect x="64" y="160" width="264" height="290" rx="20" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><circle cx="106" cy="206" r="22" fill="#2DD4BF" fill-opacity=".14" stroke="#2DD4BF" stroke-width="2"/><text x="106" y="213" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#2DD4BF" text-anchor="middle" >1</text><g transform="translate(260,188)" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10a3 3 0 0 1 3-3h10l5 6h18a3 3 0 0 1 3 3v18a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3z"/></g><text x="92" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#E8EEF8" text-anchor="start" >Isolate</text><text x="92" y="318" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#93A4C3" text-anchor="start" >Folder, .zip, .skill or</text><text x="92" y="346" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#93A4C3" text-anchor="start" >a downloaded repo.</text><text x="92" y="374" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#93A4C3" text-anchor="start" >Extraction blocks unsafe</text><text x="92" y="402" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#93A4C3" text-anchor="start" >paths and symlinks.</text><path d="M332 206H348" stroke="#5F7196" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M342 198l10 8-10 8" stroke="#5F7196" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="360" y="160" width="264" height="290" rx="20" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><circle cx="402" cy="206" r="22" fill="#2DD4BF" fill-opacity=".14" stroke="#2DD4BF" stroke-width="2"/><text x="402" y="213" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#2DD4BF" text-anchor="middle" >2</text><g transform="translate(556,188)" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="17" r="12"/><path d="M26 26l11 11"/></g><text x="388" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#E8EEF8" text-anchor="start" >Scan</text><text x="388" y="318" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#93A4C3" text-anchor="start" >Rules over scripts, text</text><text x="388" y="346" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#93A4C3" text-anchor="start" >and config. Signals are</text><text x="388" y="374" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#93A4C3" text-anchor="start" >cross-checked: keys +</text><text x="388" y="402" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#93A4C3" text-anchor="start" >network = exfiltration.</text><path d="M628 206H644" stroke="#5F7196" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M638 198l10 8-10 8" stroke="#5F7196" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="656" y="160" width="264" height="290" rx="20" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><circle cx="698" cy="206" r="22" fill="#2DD4BF" fill-opacity=".14" stroke="#2DD4BF" stroke-width="2"/><text x="698" y="213" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#2DD4BF" text-anchor="middle" >3</text><g transform="translate(852,188)" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20C10 6 30 6 38 20 30 34 10 34 2 20z"/><circle cx="20" cy="20" r="6"/></g><text x="684" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#E8EEF8" text-anchor="start" >Read</text><text x="684" y="318" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#93A4C3" text-anchor="start" >Guided manual review of</text><text x="684" y="346" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#93A4C3" text-anchor="start" >SKILL.md and scripts:</text><text x="684" y="374" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#93A4C3" text-anchor="start" >does every permission</text><text x="684" y="402" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#93A4C3" text-anchor="start" >match its purpose?</text><path d="M924 206H940" stroke="#5F7196" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M934 198l10 8-10 8" stroke="#5F7196" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="952" y="160" width="264" height="290" rx="20" fill="#131D33" stroke="#2A3A5C" stroke-width="1.5" /><circle cx="994" cy="206" r="22" fill="#2DD4BF" fill-opacity=".14" stroke="#2DD4BF" stroke-width="2"/><text x="994" y="213" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#2DD4BF" text-anchor="middle" >4</text><g transform="translate(1148,188)" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 3l15 6v11c0 9-7 15-15 18C12 35 5 29 5 20V9z"/><path d="M13 20l5 5 10-11"/></g><text x="980" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#E8EEF8" text-anchor="start" >Decide</text><text x="980" y="318" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#93A4C3" text-anchor="start" >A report with file and</text><text x="980" y="346" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#93A4C3" text-anchor="start" >line for every finding</text><text x="980" y="374" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#93A4C3" text-anchor="start" >and a clear decision</text><text x="980" y="402" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#93A4C3" text-anchor="start" >for the user.</text><rect x="64" y="480" width="1152" height="58" rx="16" fill="#F8717114" stroke="#F8717166" stroke-width="1.5" /><g transform="translate(88,489)" fill="none" stroke="#F87171" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="18" width="26" height="19" rx="4"/><path d="M13 18v-6a7 7 0 0 1 14 0v6"/></g><text x="144" y="516" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#E8EEF8" text-anchor="start" >Nothing from the target ever runs: no scripts, no installers, no “quick tests”.</text></svg>